<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projeto Afrofuturismo, notas</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Visual: noite índigo com dourado. Uma única tabela com as cinco turmas lado a lado. */
:root{
  --bg:#150f2b; --surface:#201848; --surface2:#2a2060; --line:#3b2f73; --ink:#f4effc; --muted:#b5a9d9;
  --gold:#f5b942; --gold-ink:#1b1233; --bad:#ff8f9a; --bad-soft:#4a1f3a;
  --display:'Fraunces',Georgia,serif; --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.3}
.wrap{padding:12px 12px 28px}
header{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between;margin-bottom:10px}
h1{font-family:var(--display);font-size:clamp(1.3rem,3.5vw,1.8rem);margin:0;line-height:1.1}
h1 span{color:var(--gold)}
.chip{display:inline-flex;padding:4px 12px;border-radius:999px;background:var(--surface2);color:var(--muted);font-size:.85rem}
.chip.err{background:var(--bad-soft);color:var(--bad)}
.bar{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.bar label{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--muted);font-weight:700}
input.field{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px;min-height:40px;font:inherit}
input.field.nota-big{width:80px;text-align:center;font-size:1.1rem;font-weight:700}
input.field[aria-invalid="true"]{border:2px solid var(--bad)}
.check{flex-direction:row!important;align-items:center;gap:8px!important;font-weight:400!important;font-size:.9rem!important;color:var(--ink)!important;min-height:40px}
.btn{appearance:none;border:0;background:var(--gold);color:var(--gold-ink);font:inherit;font-weight:700;padding:8px 16px;border-radius:8px;min-height:40px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.toast{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface2);border-left:4px solid var(--gold);border-radius:8px;padding:8px 12px;margin-bottom:10px}
.hidden{display:none}
.scroll{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);max-height:calc(100vh - 190px);min-height:320px}
table{border-collapse:separate;border-spacing:0}
th,td{border-bottom:1px solid var(--line);padding:2px 4px;white-space:nowrap}
thead th{position:sticky;top:0;background:var(--surface2);z-index:2;padding:6px 8px;text-align:left}
thead th small{color:var(--muted);font-weight:400;margin-left:6px}
thead th .mini{margin-left:8px;appearance:none;border:1px solid var(--gold);color:var(--gold);background:transparent;border-radius:6px;font:inherit;font-size:.78rem;padding:2px 8px;cursor:pointer}
td.nm{max-width:230px;overflow:hidden;text-overflow:ellipsis;padding-left:8px;border-left:2px solid var(--line)}
td.nm i{color:var(--muted);font-style:normal;margin-right:6px;font-size:.8rem}
td.nt{text-align:center}
input.nota{width:58px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700;font-size:.95rem;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 2px;height:28px}
input.nota.has{border-color:var(--gold);color:var(--gold)}
input.nota[aria-invalid="true"]{border:2px solid var(--bad)}
.x{appearance:none;border:0;background:transparent;color:var(--muted);width:26px;height:26px;border-radius:6px;font-size:.9rem;cursor:pointer}
.x:hover{color:var(--bad)}
.x:disabled{visibility:hidden}
tfoot td{position:sticky;bottom:0;background:var(--surface2);font-weight:700;padding:6px 8px}
.pc{color:var(--muted);margin-left:3px;font-size:.85rem;font-weight:700}
.pc.big{font-size:1.1rem;margin-left:6px}
.pcwrap{display:inline-flex;align-items:center}
.mini2{appearance:none;border:1px solid var(--line);color:var(--muted);background:transparent;border-radius:8px;font:inherit;font-size:.8rem;padding:4px 10px;margin-right:8px;cursor:pointer}
.msg{font-size:.9rem;color:var(--muted)}
.more{margin-left:auto;font-size:.85rem;color:var(--muted)}
.more summary{cursor:pointer;padding:6px 0}
.morebox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Projeto <span>Afrofuturismo</span>, notas</h1>
    <span><button id="btnGeral" class="mini2" type="button">Entrar com Google</button> <span id="status" class="chip" role="status">Entre com sua conta Google</span></span>
  </header>

  <form id="inviteForm" class="bar hidden">
    <label>Turma <select id="inviteClass" required></select></label>
    <label>Convite dos professores <input id="inviteCode" type="password" required autocomplete="off"></label>
    <button class="mini2">Vincular minha turma</button>
  </form>
  <div id="adminPanel" class="bar hidden">
    <button id="migrate" class="mini2" type="button">Migrar listas e notas anteriores</button>
    <button id="generate" class="mini2" type="button">Gerar convite dos professores</button>
    <output id="newCode"></output>
    <button id="test" class="mini2" type="button">Executar teste isolado</button>
    <output id="testObserver" aria-live="polite"></output>
  </div>
  <div id="gradeBar" class="bar hidden">
    <button id="clearClass" class="btn danger" type="button">Apagar notas da turma</button>
    <label for="bulk">Nota inicial
      <span class="pcwrap"><input id="bulk" class="field nota-big" inputmode="decimal" value="" autocomplete="off"><b class="pc big">%</b></span>
    </label>
    <label class="check"><input id="keep" type="checkbox"> Manter quem já tem nota</label>
    <span class="msg">Use “Atribuir a esta turma” para lançar em lote. O ✕ apaga a nota de um aluno.</span>
    <details class="more">
      <summary>Mais opções (todas as turmas)</summary>
      <div class="morebox">
        <button id="btnAll" class="btn ghost" type="button">Atribuir a todas as turmas</button>
        <button id="btnClearAll" class="btn danger" type="button">Apagar todas as notas</button>
        <span id="clearMsg" class="msg" aria-live="polite"></span>
      </div>
    </details>
  </div>

  <div id="toast" class="toast hidden" role="status">
    <span id="toastMsg"></span>
    <button id="btnUndo" class="btn ghost" type="button">Desfazer</button>
  </div>

  <div class="scroll"><table id="tbl"></table></div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDocFromServer, setDoc, onSnapshot, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey:"AIzaSyCrQyfKXGjEtiyOwci7jhd5_e3l3fMTClE",
  authDomain:"cepi-marajo-2026.firebaseapp.com",
  projectId:"cepi-marajo-2026",
  storageBucket:"cepi-marajo-2026.firebasestorage.app",
  messagingSenderId:"676779769177",
  appId:"1:676779769177:web:63c1671558172684056048"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();
provider.setCustomParameters({prompt:"select_account"});
const adminEmail = "malu.cesar@gmail.com";
const TURMAS = [["8A","8º A"],["8B","8º B"],["9A","9º A"],["9B","9º B"],["9C","9º C"]];
const COL = "afrofuturismo_notas";
const $ = id => document.getElementById(id);
const fmt = n => typeof n === "number" ? String(n).replace(".", ",") : "";
const hhmm = () => new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
const setStatus = (value, error = false) => {
  $("status").textContent = value;
  $("status").classList.toggle("err", error);
};
const toggle = (id, show) => $(id).classList.toggle("hidden", !show);
const escapeHtml = value => value?.replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);
const valsOf = t => store[t]?.vals ?? {};
const notesRef = t => doc(db,COL,t);
const rosterRef = t => doc(db,"afrofuturismo_turmas",t);
const accessRef = user => doc(db,"afrofuturismo_acessos",user.uid);
const digest = async value => Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(value))), x => x.toString(16).padStart(2,"0")).join("");
let visible = [], ALUNOS = {}, store = {}, ready = new Set(), listeners = [], MAXN = 0;
let session = 0, busy = false, undo = null, undoTimer;
let writeQueue = Promise.resolve();
let currentUser, isAdmin;
$("inviteClass").innerHTML = TURMAS.map(([id,label]) => '<option value="'+id+'">'+label+'</option>').join("");
function refresh() {
  if (!document.activeElement?.classList.contains("nota")) render();
}
function render(){
  let h = "<thead><tr>";
  visible.forEach(([t,n]) => {
    const com = Object.keys(valsOf(t)).length;
    h += `<th colspan="3">${n}<small>${com}/${ALUNOS[t].length}</small>${ready.has(t)?`<button class="mini" type="button" data-bulk="${t}">Atribuir a esta turma</button>`:""}</th>`;
  });
  h += "</tr></thead><tbody>";
  for (let i = 0; i < MAXN; i++){
    h += "<tr>";
    visible.forEach(([t]) => {
      const nm = escapeHtml(ALUNOS[t][i]);
      if (nm === undefined){ h += `<td class="nm"></td><td></td><td></td>`; return; }
      const v = valsOf(t)[i], has = typeof v === "number";
      h += `<td class="nm" title="${nm}"><i>${i+1}</i>${nm}</td><td class="nt"><input class="nota${has?" has":""}" data-t="${t}" data-i="${i}" inputmode="decimal" autocomplete="off" aria-label="Nota (percentual) de ${nm}" value="${fmt(v)}"${ready.has(t)?"":" disabled"}><b class="pc">%</b></td><td><button class="x" type="button" data-t="${t}" data-i="${i}" aria-label="Apagar nota de ${nm}" title="Apagar nota"${has&&ready.has(t)?"":" disabled"}>✕</button></td>`;
    });
    h += "</tr>";
  }
  h += "</tbody><tfoot><tr>";
  visible.forEach(([t]) => {
    const nums = Object.values(valsOf(t)).filter(x => typeof x === "number");
    const m = nums.length ? fmt(Math.round(nums.reduce((s,x)=>s+x,0)/nums.length*100)/100) : "–";
    h += `<td colspan="3">Com nota: ${nums.length} de ${ALUNOS[t].length} · média ${m}${nums.length?"%":""}</td>`;
  });
  h += "</tr></tfoot>";
  $("tbl").innerHTML = h;
}

function parseNum(value) {
  const input = String(value).trim().replace("%","").replace(",",".");
  if (!input) return null;
  const number = /^\d+(\.\d+)?$/.test(input) ? Number(input) : NaN;
  return number <= 100 ? Math.round(number * 100) / 100 : NaN;
}
function inform(message, entries = null) {
  undo = entries;
  $("toastMsg").textContent = message;
  toggle("btnUndo", Boolean(entries?.length));
  toggle("toast",true);
  clearTimeout(undoTimer);
  undoTimer = setTimeout(() => { undo = null; toggle("toast",false); },20000);
}
function change(ts, transform, message, reversible = false) {
  const active = session;
  writeQueue = writeQueue.then(() => {
    if (active === session) return commitChange(ts, transform, message, reversible);
  });
}
async function commitChange(ts, transform, message, reversible) {
  if (!ts.length || !ts.every(t => ready.has(t))) return;
  busy = true;
  const active = session;
  setStatus("Salvando…");
  try {
    const entries = await runTransaction(db, async tx => {
      const snapshots = await Promise.all(ts.map(t => tx.get(notesRef(t))));
      const changes = [];
      ts.forEach((t,index) => {
        const before = snapshots[index].data()?.vals ?? {};
        const after = transform(t,before);
        if (JSON.stringify(before) === JSON.stringify(after)) return;
        const revision = crypto.randomUUID();
        tx.set(notesRef(t), {turma:t, vals:after, revision, at:new Date().toISOString()}, {mergeFields:["turma","vals","revision","at"]});
        changes.push({t,before,revision});
      });
      return changes;
    });
    if (active === session) {
      setStatus("Sincronizado às " + hhmm());
      if (message) inform(message, reversible ? entries : null);
    }
  } catch (error) {
    if (active === session) setStatus(error.message === "conflito" ? "A nota mudou em outro dispositivo. Confira e tente novamente." : "A alteração não foi salva. Confira o acesso e a conexão.",true);
  } finally {
    busy = false;
    refresh();
  }
}
function bulk(ts) {
  const v = parseNum($("bulk").value);
  if (v === null || Number.isNaN(v)) { inform("Digite um percentual entre 0 e 100."); return; }
  const keep = $("keep").checked;
  change(ts,(t,before) => {
    const after = {...before};
    ALUNOS[t].forEach((_,i) => { if (!keep || typeof before[i] !== "number") after[i] = v; });
    return after;
  },"Notas atribuídas.",true);
}
$("btnAll").onclick = () => isAdmin && bulk(visible.map(([t]) => t));
function clear(ts) {
  if (confirm("Apagar todas as notas das turmas selecionadas?")) change(ts,() => ({}),"Notas apagadas.",true);
}
$("btnClearAll").onclick = () => isAdmin && clear(visible.map(([t]) => t));
$("clearClass").onclick = () => { if (visible.length === 1) clear([visible[0][0]]); };
$("tbl").addEventListener("click", event => {
  const bulkButton = event.target.closest("button[data-bulk]");
  if (bulkButton) { bulk([bulkButton.dataset.bulk]); return; }
  const button = event.target.closest("button.x");
  if (!button || button.disabled) return;
  const {t,i} = button.dataset;
  const expected = valsOf(t)[i];
  change([t],(_,before) => {
    if (before[i] !== expected) throw Error("conflito");
    const after = {...before};
    delete after[i];
    return after;
  },"Nota apagada.",true);
});
$("btnUndo").onclick = async () => {
  if (!undo || busy) return;
  const entries = undo;
  busy = true;
  try {
    await runTransaction(db, async tx => {
      const snapshots = await Promise.all(entries.map(({t}) => tx.get(notesRef(t))));
      if (snapshots.some((snap,i) => snap.data()?.revision !== entries[i].revision)) throw Error("conflito");
      entries.forEach(({t,before}) => tx.update(notesRef(t), {vals:before,revision:crypto.randomUUID(),at:new Date().toISOString()}));
    });
    inform("Alteração desfeita.");
  } catch { inform("Não foi possível desfazer. Confira se houve outro lançamento."); }
  finally { busy = false; refresh(); }
};
$("tbl").addEventListener("focusin", event => {
  const input = event.target.closest("input.nota");
  if (input) input.dataset.original = input.value;
});
$("tbl").addEventListener("change", event => {
  const input = event.target.closest("input.nota");
  if (!input) return;
  const value = parseNum(input.value);
  if (Number.isNaN(value)) { inform("Digite um percentual entre 0 e 100."); return; }
  const {t,i,original} = input.dataset;
  const expected = parseNum(original);
  change([t],(_,before) => {
    if ((before[i] ?? null) !== expected) throw Error("conflito");
    const after = {...before};
    if (value === null) delete after[i]; else after[i] = value;
    return after;
  });
});
$("tbl").addEventListener("keydown", event => {
  if (event.key === "Enter" && event.target.matches("input.nota")) { event.preventDefault(); event.target.blur(); }
});
$("tbl").addEventListener("focusout", () => setTimeout(refresh,0));
$("tbl").addEventListener("paste", event => {
  const input = event.target.closest("input.nota");
  if (!input) return;
  const rows = event.clipboardData.getData("text").trimEnd().split(/\r?\n/);
  if (rows.length < 2) return;
  event.preventDefault();
  const {t,i} = input.dataset;
  const expected = {...valsOf(t)};
  const edits = rows.map((row,offset) => [Number(i)+offset,parseNum(row.split("\t").at(-1))])
    .filter(([index,v]) => index < ALUNOS[t].length && !Number.isNaN(v));
  change([t],(_,before) => {
    const after = {...before};
    for (const [index,v] of edits) {
      if ((before[index] ?? null) !== (expected[index] ?? null)) throw Error("conflito");
      if (v === null) delete after[index]; else after[index] = v;
    }
    return after;
  },"Notas coladas.",true);
});
async function openScope(classes, active) {
  const rows = await Promise.all(classes.map(async ([t,label]) => {
    const roster = await getDocFromServer(rosterRef(t));
    return {t,label,names:roster.data()?.names};
  }));
  if (active !== session) return;
  visible = rows.filter(r => Array.isArray(r.names)).map(r => [r.t,r.label]);
  ALUNOS = Object.fromEntries(rows.map(r => [r.t,r.names ?? []]));
  MAXN = Math.max(0,...visible.map(([t])=>ALUNOS[t].length));
  toggle("gradeBar",visible.length > 0);
  toggle("clearClass",visible.length === 1);
  document.querySelector(".more").hidden = !isAdmin || visible.length !== TURMAS.length;
  render();
  if (!visible.length) { setStatus("As listas das turmas aguardam a migração."); return; }
  visible.forEach(([t]) => listeners.push(onSnapshot(notesRef(t), {includeMetadataChanges:true}, snap => {
    if (active !== session || snap.metadata.fromCache || snap.metadata.hasPendingWrites) return;
    store[t] = snap.data();
    ready.add(t);
    if (!busy) setStatus("Conectado · " + hhmm());
    refresh();
  },() => { ready.delete(t); setStatus("O Firestore recusou o acesso às notas.",true); refresh(); })));
}
$("btnGeral").onclick = async () => {
  try { if (auth.currentUser) await signOut(auth); else await signInWithPopup(auth,provider); }
  catch (error) { setStatus("Falha no login Google (" + (error.code || "erro") + ").",true); }
};
onAuthStateChanged(auth,async user => {
  const active = ++session;
  listeners.forEach(stop => stop());
  listeners = [];
  visible = []; ALUNOS = {}; store = {}; ready = new Set(); MAXN = 0;
  currentUser = user;
  isAdmin = user?.emailVerified && user.email === adminEmail;
  undo = null;
  $("newCode").textContent = "";
  ["inviteForm","adminPanel","gradeBar","toast"].forEach(id=>toggle(id,false));
  render();
  $("btnGeral").textContent = user ? "Sair" : "Entrar com Google";
  if (!user) { setStatus("Entre com sua conta Google"); return; }
  setStatus("Verificando acesso…");
  try {
    if (isAdmin) {
      toggle("adminPanel",true);
      listeners.push(onSnapshot(notesRef("teste-sincronizacao"), {includeMetadataChanges:true}, snap => {
        if (active !== session || snap.metadata.fromCache || snap.metadata.hasPendingWrites) return;
        const data = snap.data();
        if (data) $("testObserver").textContent = "Teste remoto: " + (data.vals[0] ?? "nota excluída") + " · " + data.revision.slice(0,8);
      }));
      await openScope(TURMAS,active);
    } else {
      const member = await getDocFromServer(accessRef(user));
      if (active !== session) return;
      if (member.exists()) await openScope(TURMAS.filter(([t]) => t === member.data().turma),active);
      else { toggle("inviteForm",true); setStatus("Informe o convite e escolha sua turma"); }
    }
  } catch { if (active === session) setStatus("Falha ao verificar o acesso.",true); }
});
$("inviteForm").onsubmit = async event => {
  event.preventDefault();
  const user = currentUser, active = session, turma = $("inviteClass").value;
  try {
    const convite = await digest($("inviteCode").value.trim());
    $("inviteCode").value = "";
    await setDoc(accessRef(user),{turma,convite});
    if (active === session) { toggle("inviteForm",false); await openScope(TURMAS.filter(([t]) => t === turma),active); }
  } catch { if (active === session) setStatus("Convite inválido, acesso já vinculado ou falha de conexão.",true); }
};
$("generate").onclick = async () => {
  if (!isAdmin) return;
  const code = crypto.randomUUID() + crypto.randomUUID();
  try {
    await setDoc(doc(db,"afrofuturismo_convites",await digest(code)),{at:new Date().toISOString()});
    $("newCode").textContent = code;
  } catch { setStatus("Não foi possível gerar o convite.",true); }
};
$("migrate").onclick = async () => {
  if (!isAdmin) return;
  $("migrate").disabled = true;
  try {
    const response = await fetch("https://raw.githubusercontent.com/malucesarrobot/Cepi-marajo-2026/ffdc265d11a8bb45c53b59f8ab07d028505e72c5/afrofuturismo/index.html");
    if (!response.ok) throw Error("fonte");
    const source = await response.text();
    const oldRoster = source.match(/const ALUNOS = (\{[\s\S]*?\n\});/)?.[1];
    const oldNotes = source.match(/const SEED = (\{[^\n]*\});/)?.[1];
    const decode = value => JSON.parse(value.replace(/([{,])\s*([0-9]+[A-Z]?|[A-Za-z_]+)\s*:/g,'$1"$2":').replace(/,\s*([}\]])/g,"$1"));
    const names = decode(oldRoster), notes = decode(oldNotes);
    if (Object.keys(notes["9C"] ?? {}).length !== 33 || !TURMAS.every(([t], i) => names[t]?.length === [33,35,35,37,36][i])) throw Error("contagem");
    await runTransaction(db, async tx => {
      const refs = [...TURMAS.map(([t])=>rosterRef(t)),notesRef("9C")];
      const snaps = await Promise.all(refs.map(ref=>tx.get(ref)));
      TURMAS.forEach(([t],i)=> { if (!snaps[i].exists()) tx.set(refs[i],{names:names[t]}); });
      if (!snaps[5].exists()) tx.set(refs[5],{turma:"9C",vals:notes["9C"],at:new Date().toISOString()});
    });
    await openScope(TURMAS,session);
    inform("Listas e notas anteriores conferidas na migração.");
  } catch(error) { setStatus("Migração pendente (" + (error.code || error.message) + ").",true); }
  finally { $("migrate").disabled = false; }
};
$("test").onclick = async () => {
  if (!isAdmin) return;
  $("test").disabled = true;
  const t = "teste-sincronizacao", ref = notesRef(t);
  let stop;
  const marker = crypto.randomUUID();
  const signals = new Map();
  try {
    stop = onSnapshot(ref,{includeMetadataChanges:true},snapshot => {
      if (snapshot.metadata.fromCache || snapshot.metadata.hasPendingWrites) return;
      const record = snapshot.data();
      if (record?.revision === marker) signals.get(String(record.vals[0] ?? ""))?.();
    });
    async function check(value, vals) {
      let timer;
      const seen = new Promise((resolve,reject) => {
        signals.set(value,resolve);
        timer = setTimeout(()=>reject(Error("tempo")),10000);
      });
      try {
        await Promise.all([seen,setDoc(ref,{turma:t,vals,revision:marker})]);
        const remote = await getDocFromServer(ref);
        if (remote.data()?.revision !== marker || String(remote.data().vals[0] ?? "") !== value) throw Error("leitura");
      } finally { clearTimeout(timer); signals.delete(value); }
    }
    await check("41",{0:41});
    await check("72",{0:72});
    await check("",{});
    inform("Teste isolado passou: leitura, gravação, edição, exclusão da nota e atualização do observador.");
  } catch (error) { setStatus("Teste inconclusivo (" + (error.code || error.message) + ").",true); }
  finally { if (stop) stop(); $("test").disabled = false; }
};

</script>
