<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projeto Afrofuturismo, notas</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Visual: noite índigo com dourado. Uma única tabela com as cinco turmas lado a lado. */
:root{
  --bg:#150f2b; --surface:#201848; --surface2:#2a2060; --line:#3b2f73; --ink:#f4effc; --muted:#b5a9d9;
  --gold:#f5b942; --gold-ink:#1b1233; --bad:#ff8f9a; --bad-soft:#4a1f3a;
  --display:'Fraunces',Georgia,serif; --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.3}
.wrap{padding:12px 12px 28px}
header{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between;margin-bottom:10px}
h1{font-family:var(--display);font-size:clamp(1.3rem,3.5vw,1.8rem);margin:0;line-height:1.1}
h1 span{color:var(--gold)}
.chip{display:inline-flex;padding:4px 12px;border-radius:999px;background:var(--surface2);color:var(--muted);font-size:.85rem}
.chip.err{background:var(--bad-soft);color:var(--bad)}
.bar{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.bar label{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--muted);font-weight:700}
input.field{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px;min-height:40px;font:inherit}
input.field.nota-big{width:80px;text-align:center;font-size:1.1rem;font-weight:700}
input.field[aria-invalid="true"]{border:2px solid var(--bad)}
.check{flex-direction:row!important;align-items:center;gap:8px!important;font-weight:400!important;font-size:.9rem!important;color:var(--ink)!important;min-height:40px}
.btn{appearance:none;border:0;background:var(--gold);color:var(--gold-ink);font:inherit;font-weight:700;padding:8px 16px;border-radius:8px;min-height:40px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.toast{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface2);border-left:4px solid var(--gold);border-radius:8px;padding:8px 12px;margin-bottom:10px}
.hidden{display:none}
.scroll{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);max-height:calc(100vh - 190px);min-height:320px}
table{border-collapse:separate;border-spacing:0}
th,td{border-bottom:1px solid var(--line);padding:2px 4px;white-space:nowrap}
thead th{position:sticky;top:0;background:var(--surface2);z-index:2;padding:6px 8px;text-align:left}
thead th small{color:var(--muted);font-weight:400;margin-left:6px}
thead th .mini{margin-left:8px;appearance:none;border:1px solid var(--gold);color:var(--gold);background:transparent;border-radius:6px;font:inherit;font-size:.78rem;padding:2px 8px;cursor:pointer}
td.nm{max-width:230px;overflow:hidden;text-overflow:ellipsis;padding-left:8px;border-left:2px solid var(--line)}
td.nm i{color:var(--muted);font-style:normal;margin-right:6px;font-size:.8rem}
td.nt{text-align:center}
input.nota{width:58px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700;font-size:.95rem;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 2px;height:28px}
input.nota.has{border-color:var(--gold);color:var(--gold)}
input.nota[aria-invalid="true"]{border:2px solid var(--bad)}
.x{appearance:none;border:0;background:transparent;color:var(--muted);width:26px;height:26px;border-radius:6px;font-size:.9rem;cursor:pointer}
.x:hover{color:var(--bad)}
.x:disabled{visibility:hidden}
tfoot td{position:sticky;bottom:0;background:var(--surface2);font-weight:700;padding:6px 8px}
.pc{color:var(--muted);margin-left:3px;font-size:.85rem;font-weight:700}
.pc.big{font-size:1.1rem;margin-left:6px}
.pcwrap{display:inline-flex;align-items:center}
.mini2{appearance:none;border:1px solid var(--line);color:var(--muted);background:transparent;border-radius:8px;font:inherit;font-size:.8rem;padding:4px 10px;margin-right:8px;cursor:pointer}
.msg{font-size:.9rem;color:var(--muted)}
.more{margin-left:auto;font-size:.85rem;color:var(--muted)}
.more summary{cursor:pointer;padding:6px 0}
.morebox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Projeto <span>Afrofuturismo</span>, notas</h1>
    <span><button id="btnGeral" class="mini2" type="button">Acesso geral</button> <span id="status" class="chip" role="status">Conectando…</span></span>
  </header>

  <div class="bar">
    <label for="bulk">Nota inicial
      <span class="pcwrap"><input id="bulk" class="field nota-big" inputmode="decimal" value="" autocomplete="off"><b class="pc big">%</b></span>
    </label>
    <label class="check"><input id="keep" type="checkbox"> Manter quem já tem nota</label>
    <span class="msg">Destrave sua turma com a senha e use “Atribuir a esta turma”. O ✕ apaga a nota de um aluno.</span>
    <details class="more">
      <summary>Mais opções (todas as turmas)</summary>
      <div class="morebox">
        <button id="btnAll" class="btn ghost" type="button">Atribuir a todas as turmas</button>
        <button id="btnClearAll" class="btn danger" type="button">Apagar todas as notas</button>
        <span id="clearMsg" class="msg" aria-live="polite"></span>
      </div>
    </details>
  </div>

  <div id="toast" class="toast hidden" role="status">
    <span id="toastMsg"></span>
    <button id="btnUndo" class="btn ghost" type="button">Desfazer</button>
  </div>

  <div class="scroll"><table id="tbl"></table></div>
</div>

<script type="module">
"use strict";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey:"AIzaSyCrQyfKXGjEtiyOwci7jhd5_e3l3fMTClE",
  authDomain:"cepi-marajo-2026.firebaseapp.com",
  projectId:"cepi-marajo-2026",
  storageBucket:"cepi-marajo-2026.firebasestorage.app",
  messagingSenderId:"676779769177",
  appId:"1:676779769177:web:63c1671558172684056048"
};
const COL = "afrofuturismo_notas";
const PASS_HASH = {"8A":"a0a5935330e59384332d5558aed5818346d9552807254ff9f99dde42372536c6","8B":"09066b7b27f17a85b2a6a8d00adba9c13c96cf98ba095ef499811c65bcfe7ee1","9A":"4485b18e1e12c5511f79b2492e1281b609f2c1f3bdc11f381919abf301dd93ec","9B":"321de264d48446a35788ce9a6c695e3f4bb007c77ea1eb728f722ca284e8ca35","9C":"376b199e3bd55fba564e971c175842b166de0a2b47caae4f096af7a31957f5dd","ALL":"a3e8bfaf3468cdfa8eea9f13072e463ea1f9f874ab350b5724ddac9b16d5441e"};
const unlocked = new Set(JSON.parse(sessionStorage.getItem("afro_unlock")||"[]"));
const canEdit = t => unlocked.has("ALL") || unlocked.has(t);
async function sha(s){ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s.trim().toLowerCase())); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
async function destravar(t){
  const label = t==="ALL" ? "acesso geral" : "a turma "+TNAME[t];
  const p = prompt("Digite a senha de "+label+":"); if (p===null) return;
  if (await sha(p) === PASS_HASH[t]){ unlocked.add(t); try{sessionStorage.setItem("afro_unlock",JSON.stringify([...unlocked]));}catch(_){} render(); applyMore(); }
  else alert("Senha incorreta.");
}
function applyMore(){ const m=document.querySelector(".more"); if (m) m.style.display = unlocked.has("ALL") ? "" : "none"; }

const TURMAS = [["8A","8º A"],["8B","8º B"],["9A","9º A"],["9B","9º B"],["9C","9º C"]];
const TNAME = Object.fromEntries(TURMAS);

const ALUNOS = {
"9A":["ANA LÍVIA DE MELO SOARES","ARTHUR VASCONCELOS NUNES","ARYANE AUZIER SOUZA","ASHLEY JULIA DE PAIVA CABRAL","BRAYAN ELLIOT DA COSTA MENDES","DAVI MOREIRA DE FARIAS","DÉBORA HADASSA FERREIRA COUTINHO","DHIENNY CHRISTINY DINIZ DOS SANTOS","ELOÍSA DA SILVA RIBEIRO","EMANOELLY DO AMARAL ALMEIDA","EMANUELLY DOS REIS MENEZES","GEOVANA FERNANDES MELO","GIOVANNA SILVA SOUSA","GUSTAVO ALEXANDRE RIBEIRO DE SOUTO","HANS DONNER DE JESUS CARVALHO","JOÃO CARLOS GOMES LACERDA","JUAN DA COSTA E SILVA","JUDITE SANTANA DOS SANTOS","JULIA FERNANDES MENDES","KEMILLY YASMIN FERREIRA DE SOUSA","LETÍCIA RUFINO DA SILVA","LORRANY ANCELMO DE OLIVEIRA","LUÍZA FERREIRA MARTINS","MARIA EDUARDA RODRIGUES DA SILVA","MARÍA FERNANDA GOMES DA SILVA","MARIA HELOIZA DOS SANTOS FREITAS","MIGUEL ANTÔNIO SOUZA CARVALHO","MIQUEIAS COELHO DA SILVA","RADIJA RODRIGUES SANTOS","RIKELMY PINHEIRO VISGUEIRA","RODRIGO MELO DE LIMA","SAMUEL GONÇALVES DE JESUS","SOPHIA VITÓRIA NEVES SANTANA","WESLEY RAMOS DA SILVA","YASMIN VICTÓRIA DE BARRO SILVA"],
"9B":["ALICE COSTA SANTOS","ANA PAULA SILVA CABRAL","BEATRIZ PEREIRA ALVES DA SILVA","CLARA THAINÁ RODRIGUES VALADARES","DANIEL OLIVEIRA MARTINS","DANIEL RODRIGUES DE SOUSA","DAVI OLIVEIRA MARTINS","DHENILLY SOPHYA GOMES DOS SANTOS","DIEGO OLIVEIRA MARTINS","EDUARDO EMANUEL RODRIGUES DOS SANTOS","ELLYSSON BRUNO RIBEIRO DE SANTANA","EMANUELY VITÓRIA TAVARES CAMPELO DA SILVA","ENZO OLIVEIRA DUARTE","ERIK FELIPE PEREIRA BARBOZA","FELIPE PEREIRA SANTOS","FELIPE SOUSA SANTOS","GEOVANNA INACIO LIMA","GIAN CARLOS LEAL MARTINS","HELOISY MARIA ARAGÃO DE SOUSA","IANARA MARCELLY DE OLIVEIRA DA SILVA","JOÃO ARTHUR MORAES OLIVEIRA","KAIK JULIAN FERREIRA ROCHA","KAIO THAYLOR SOUSA PAIXÃO","KAYO AUGUSTO ARAUJO DOS ANJOS","LAURA SOUZA DOS ANJOS","LORRANE CAMARA DOS SANTOS","LUAN RONY DA TRINDADE MEDEIROS","MARIANY VIEIRA MILITÃO","MIGUEL ANGELLO COELHO SANTOS","MIGUEL CARLOS FERNANDES DA SILVA","NADYELY VITÓRIA PEREIRA ALVES DA SILVA","NATHALIA VIANA DE SOUZA","NICOLLE CHRISTINA ALVES FERNANDES","SOPHIA LOPES DE OLIVEIRA","STEFANY SILVA ALVES","VITORIA FERNANDES DE JESUS","ZAQUEL DOS SANTOS MARQUES"],
"9C":["ANA PAULA SANTANA CARVALHO","ANTONIO GUILHERME RODRIGUES CAVALCANTE","CESAR DAVID VELIZ SALAZAR","DAVI ASAFE SILVA COSTA","DIEGO PEREIRA DA SILVA","EDUARDO MANOEL PEREIRA DA COSTA","GUSTAVO SHAKESPEARE RODRIGUES DOS SANTOS","IGOR INDRA DA COSTA","ISADORA SILVA DOS SANTOS","IVAN PEDRO SANTANA ABREU","JAQUELINE VITÓRIA PEREIRA DA COSTA MUNIZ","JOSÉ MIZAEL RODRIGUES DA SILVA","JÚLIA FERREIRA DIAS PEREIRA","KALEB DOS SANTOS OLIVEIRA","KALINY VITÓRIA NUNES DA SILVA","KAUAN DE SOUSA CASTRO GOMES","LARA BARCELAR DE SOUZA","LIDIA VITÓRIA FÉLIX ULHOA","LUCAS FERREIRA DA SILVA DANTAS","LUIZ FELIPE SOUZA COSTA","MARCOS DO ESPÍRITO SANTO PAIVA","MARCOS VINÍCIUS PEREIRA DA SILVA","MARCUS VINICIUS SILVA CUNHA","MARIA CLARA FREIRE DOS SANTOS","MARIA EDUARDA ANDRADE DE SOUZA","MARIA VITÓRYA PEREIRA SILVA","MATEUS HENRIQUE COSTA RODRIGUES","MAXUEL FERREIRA AZEVEDO DA SILVA","MELISSA ANDRADE SIMÃO","MILENA DE JESUS FREITAS","RONALD NEVES BARROS","SAMUEL VIEIRA DE OLIVEIRA","SAMYLA LORRANE RODRIGUES DE SOUSA","THALITA ROSARIO SANTANA DOS SANTOS","VICTOR HUGO COSTA ANDRADE","YAGO OLIVEIRA MATIAS"],
"8A":["ALICIA ROCHA DE OLIVEIRA","ANA RUTHE DA SILVA GONÇALVES","DAVI LUCAS COLACIO DE SALES","ERICK MARK GONÇALVES LEAL","ESTHER CRISTINNY AMARAL GOMES","GABRIELLY CARDOSO VIEIRA","HAGATHA CRISTINA DA TRINDADE SANTOS","ISABELLA BRITO MAGALHÃES","ITALO GUSTAVO DOS SANTOS FRANÇA","JADY DOS SANTOS SILVA","JOÃO VICTOR ALVES RODRIGUES","JULYANA LUCIANO DO NASCIMENTO","KALLEB DOS SANTOS MARQUES","KENNEDY GABRIEL NEVES DOS SANTOS","KEVIN RYLEN GUEDES DOS SANTOS","LUCAS MATHEUS BARBOSA DA SILVA","LYEDYSSON ALEXSANDRO DA SILVA SANTOS","MAIRA KELI DE OLIVEIRA SILVA","MARIA FERNANDA DA CRUZ MENDES","MARIA HELOIZA DA CUNHA MENDES","MARIA ISABELLA DOS SANTOS DE LIMA","MARIA VITÓRIA OLIVEIRA DE SA","MAURÍCIO HAZARD MENEZES DE SOUZA","NAYRA LUIZA PEREIRA DOS SANTOS","PEDRO HENRIQUE FAUSTINO DA SILVA","PIETRO ALVES DE JESUS","RHUTY MICKELANNY DE SOUZA TEIXEIRA","ROBERTA KADYLLE SANTOS DA SILVA","SAMUEL FELIX DOS SANTOS","SOFIA RODRIGUES DE SOUZA","VALESCA CRISTINA DE MELO PARANHOS","VITÓRIA COSTA DE DEUS","GABRIELA BRITO PINEIRO"],
"8B":["ANA BEATRIZ SOUSA DE MORAES","ANA CLARA RODRIGUES DE SOUZA","ANA KESIA ALCÂNTARA DA SILVA","ANA LUÍSA DOS SANTOS CAMPOS","ANNA ALICY GOMES DAS NEVES","BRUNO OLIVEIRA SANTOS","CARLOS CLECIO SANTOS SOUZA","CLARA CANGIRANA DA SILVA","DAVI LUIS OLIVEIRA SAMPAIO","DIOGO EMANUEL DA SILVA CRUZ","EVELLY LAUANE BARROS CARVALHO","GABRIEL BENTO DA SILVA","HIAGO NERY DA SILVA","ÌTALO DAVISON RAMOS MOURA SANTOS CORDEIRO","KAIO DANIEL REIS PACHECO","KALLEB ARAUJO DA SILVA","KARINNY LOUISE MUNIZ","KARLEANY VITÓRIA RODRIGUES DOS SANTOS","KYMY RAFAELA DA COSTA MIRANDA","LARISSA ISABELLA LEAL DE CARVALHO","LUCAS DA COSTA SILVA","LUIZA SÁTIRO DE OLIVEIRA","MARIA CLARA CHAVES BARCELOS","MARIA ELOYSA CARVALHO DOS SANTOS","MARYA EDUARDA PEREIRA DA SILVA","MATHEUS SOUZA PEREIRA DE ARAUJO","NICOLAS MIGUEL DIAS DA SILVA","SARAH QUIRINO DOS SANTOS ARAUJO","SOPHIA OLIVEIRA DA SILVA","SOPHYA LARYSSA AMARAL DOS SANTOS","TALLYSSON WANDRYLL CARDOSO OSORIO","THALIA VITÓRIA SILVA PONTE RODRIGUES","THALYA SOUZA AMARAL","VITOR LUCAS ROCHA DE JESUS","YASMIM GABRIELLY DOS SANTOS PESSOA"]
};

const $ = id => document.getElementById(id);
let db = null, canWrite = true, store = {}, undoSnap = null, undoTimer = null;
const dirty = {}, saving = {}, pending = {}, timers = {};
const MAXN = Math.max(...TURMAS.map(([t]) => ALUNOS[t].length));

function parseNum(s){
  s = String(s).trim().replace("%","").replace(",", ".");
  if (s === "") return null;
  if (!/^\d+(\.\d+)?$/.test(s)) return NaN;
  const n = Math.round(parseFloat(s)*100)/100;
  return n > 100 ? NaN : n;
}
const fmt = n => (typeof n === "number") ? String(n).replace(".", ",") : "";
const valsOf = t => (store[t] && store[t].vals) || {};
const hhmm = () => new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
function setStatus(text, kind){ const el=$("status"); el.textContent=text; el.className="chip"+(kind?" "+kind:""); }

/* ---------- Dados ---------- */
function setVal(t, i, v){
  const vals = Object.assign({}, valsOf(t));
  if (v === null) delete vals[i]; else vals[i] = v;
  store[t] = Object.assign({}, store[t], { vals });
}
function queueSave(t){
  dirty[t] = true; setStatus("Salvando…");
  clearTimeout(timers[t]); timers[t] = setTimeout(() => flush(t), 600);
}
async function flush(t){
  if (!db){ dirty[t] = false; setStatus("Modo local: não compartilhado", "err"); return; }
  if (saving[t]){ pending[t] = true; return; }
  saving[t] = true;
  try {
    await setDoc(doc(db, COL, t), { turma: t, vals: valsOf(t), at: new Date().toISOString() });
    setStatus("Salvo às " + hhmm());
  } catch (e) {
    setStatus("Não foi possível salvar. Você precisa de acesso para editar.", "err");
  } finally {
    saving[t] = false;
    if (pending[t]){ pending[t] = false; flush(t); } else dirty[t] = false;
  }
}

/* ---------- Tabela ---------- */
function render(){
  let h = "<thead><tr>";
  TURMAS.forEach(([t,n]) => {
    const com = Object.keys(valsOf(t)).length;
    h += `<th colspan="3">${n}<small>${com}/${ALUNOS[t].length}</small>${canEdit(t)?`<button class="mini" type="button" data-bulk="${t}">Atribuir a esta turma</button>`:`<button class="mini" type="button" data-unlock="${t}">🔒 Destravar</button>`}</th>`;
  });
  h += "</tr></thead><tbody>";
  for (let i = 0; i < MAXN; i++){
    h += "<tr>";
    TURMAS.forEach(([t]) => {
      const nm = ALUNOS[t][i];
      if (nm === undefined){ h += `<td class="nm"></td><td></td><td></td>`; return; }
      const v = valsOf(t)[i], has = typeof v === "number";
      h += `<td class="nm" title="${nm}"><i>${i+1}</i>${nm}</td><td class="nt"><input class="nota${has?" has":""}" data-t="${t}" data-i="${i}" inputmode="decimal" autocomplete="off" aria-label="Nota (percentual) de ${nm}" value="${fmt(v)}"${canEdit(t)?"":" disabled"}><b class="pc">%</b></td><td><button class="x" type="button" data-t="${t}" data-i="${i}" aria-label="Apagar nota de ${nm}" title="Apagar nota"${has&&canEdit(t)?"":" disabled"}>✕</button></td>`;
    });
    h += "</tr>";
  }
  h += "</tbody><tfoot><tr>";
  TURMAS.forEach(([t]) => {
    const nums = Object.values(valsOf(t)).filter(x => typeof x === "number");
    const m = nums.length ? fmt(Math.round(nums.reduce((s,x)=>s+x,0)/nums.length*100)/100) : "–";
    h += `<td colspan="3">Com nota: ${nums.length} de ${ALUNOS[t].length} · média ${m}${nums.length?"%":""}</td>`;
  });
  h += "</tr></tfoot>";
  $("tbl").innerHTML = h;
}
function refresh(){
  const a = document.activeElement;
  if (a && a.classList && a.classList.contains("nota")) return; // não atrapalha quem está digitando
  render();
}

/* ---------- Ações em massa e desfazer ---------- */
function snapshot(ts){ undoSnap = {}; ts.forEach(t => { undoSnap[t] = Object.assign({}, valsOf(t)); }); }
function showToast(msg, withUndo){
  $("toastMsg").textContent = msg; $("btnUndo").classList.toggle("hidden", !withUndo); $("toast").classList.remove("hidden");
  clearTimeout(undoTimer); undoTimer = setTimeout(() => { $("toast").classList.add("hidden"); undoSnap = null; }, 20000);
}
function bulk(ts, label){
  if (!ts.every(canEdit)) return;
  const v = parseNum($("bulk").value);
  if (v === null || Number.isNaN(v)){ $("bulk").setAttribute("aria-invalid","true"); showToast("Digite o percentual (0 a 100) no campo Nota inicial antes de atribuir.", false); return; }
  $("bulk").removeAttribute("aria-invalid");
  const keep = $("keep").checked; snapshot(ts);
  let count = 0;
  ts.forEach(t => {
    const next = Object.assign({}, valsOf(t));
    ALUNOS[t].forEach((_, i) => { if (keep && typeof next[i] === "number") return; next[i] = v; count++; });
    store[t] = Object.assign({}, store[t], { vals: next }); queueSave(t);
  });
  render();
  showToast(`Nota ${fmt(v)}% atribuída a ${count} aluno(s) (${label}). Use o ✕ para apagar de quem não participou.`, true);
}
$("btnAll").onclick = () => unlocked.has("ALL") && bulk(TURMAS.map(x => x[0]), "todas as turmas");
$("tbl").addEventListener("click", e => {
  const ub = e.target.closest("button[data-unlock]");
  if (ub){ destravar(ub.dataset.unlock); return; }
  const bb = e.target.closest("button[data-bulk]");
  if (bb){ bulk([bb.dataset.bulk], TNAME[bb.dataset.bulk]); return; }
  const x = e.target.closest("button.x");
  if (x && !x.disabled){ setVal(x.dataset.t, Number(x.dataset.i), null); queueSave(x.dataset.t); render(); }
});
$("btnUndo").onclick = () => {
  if (!undoSnap) return;
  Object.keys(undoSnap).forEach(t => { store[t] = Object.assign({}, store[t], { vals: undoSnap[t] }); queueSave(t); });
  undoSnap = null; $("toast").classList.add("hidden"); render();
};
let armed = false;
$("btnClearAll").onclick = () => {
  const m = $("clearMsg");
  if (!unlocked.has("ALL")) return;
  if (!armed){ armed = true; m.textContent = "Toque de novo para confirmar."; m.style.color = "var(--bad)"; setTimeout(() => { armed = false; m.textContent = ""; }, 4000); return; }
  armed = false; m.textContent = "";
  const ts = TURMAS.map(x => x[0]); snapshot(ts);
  ts.forEach(t => { store[t] = Object.assign({}, store[t], { vals:{} }); queueSave(t); });
  render(); showToast("Todas as notas foram apagadas.", true);
};

/* ---------- Digitar e colar ---------- */
$("tbl").addEventListener("input", e => {
  const inp = e.target.closest("input.nota"); if (!inp) return;
  const v = parseNum(inp.value);
  if (Number.isNaN(v)){ inp.setAttribute("aria-invalid","true"); return; }
  inp.removeAttribute("aria-invalid");
  const t = inp.dataset.t, i = Number(inp.dataset.i);
  if ((valsOf(t)[i] ?? null) === v) return;
  setVal(t, i, v); queueSave(t);
  inp.classList.toggle("has", v !== null);
  const x = inp.closest("tr").querySelector(`button.x[data-t="${t}"][data-i="${i}"]`); if (x) x.disabled = (v === null);
});
$("tbl").addEventListener("keydown", e => {
  const inp = e.target.closest("input.nota"); if (!inp || e.key !== "Enter") return;
  e.preventDefault();
  const next = document.querySelector(`input.nota[data-t="${inp.dataset.t}"][data-i="${Number(inp.dataset.i)+1}"]`);
  if (next){ next.focus(); next.select(); } else inp.blur();
});
$("tbl").addEventListener("blur", e => { if (e.target.classList && e.target.classList.contains("nota")) setTimeout(refresh, 0); }, true);
$("tbl").addEventListener("paste", e => {
  const inp = e.target.closest("input.nota"); if (!inp) return;
  const text = (e.clipboardData || window.clipboardData).getData("text");
  if (!/\n/.test(text.trim())) return;
  e.preventDefault();
  const t = inp.dataset.t; let i = Number(inp.dataset.i);
  text.replace(/\r/g,"").split("\n").map(l => l.split("\t").pop().trim()).filter((l,k,a) => !(l === "" && k === a.length-1)).forEach(l => {
    if (i >= ALUNOS[t].length) return;
    const v = parseNum(l); if (!Number.isNaN(v)) setVal(t, i, v);
    i++;
  });
  queueSave(t); inp.blur(); render();
});

// Notas do 9º C lançadas antes da migração (usadas só se o documento ainda não existir)
const SEED = {"9C":{"0":100,"1":100,"2":100,"3":100,"4":100,"5":100,"6":100,"7":100,"8":100,"9":100,"10":100,"11":100,"12":100,"13":100,"14":100,"15":100,"16":100,"18":100,"19":100,"20":100,"21":100,"22":100,"23":100,"24":100,"26":70,"28":100,"29":100,"30":100,"31":100,"32":100,"33":100,"34":100,"35":100}};
$("btnGeral").onclick = () => destravar("ALL");
applyMore();
render();
(async () => {
  const timer = setTimeout(() => setStatus("Sem conexão com os dados compartilhados. Os lançamentos podem não salvar.", "err"), 10000);
  try {
    db = getFirestore(initializeApp(firebaseConfig));
  } catch(_){ db = null; }
  if (!db){ clearTimeout(timer); setStatus("Modo local: não compartilhado", "err"); return; }
  let seeded = false;
  onSnapshot(collection(db, COL), snap => {
    const next = {};
    snap.docs.forEach(d => { next[d.id] = d.data(); });
    if (!seeded && !snap.metadata.fromCache){
      seeded = true;
      Object.keys(SEED).forEach(t => {
        if (!next[t]){ next[t] = { turma:t, vals:SEED[t] }; setDoc(doc(db, COL, t), { turma:t, vals:SEED[t], at:new Date().toISOString() }).catch(()=>{}); }
      });
    }
    Object.keys(dirty).forEach(t => { if (dirty[t] || saving[t]) next[t] = store[t]; });
    store = next;
    if (!snap.metadata.fromCache){ clearTimeout(timer); setStatus("Conectado · " + hhmm()); }
    refresh();
  }, () => { clearTimeout(timer); setStatus("Sem permissão ou erro ao carregar os dados. Avise a professora Malu.", "err"); });
})();
